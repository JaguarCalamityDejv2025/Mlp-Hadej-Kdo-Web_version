    <title>Hádej Kdo - MLP Edice</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff7a3d, #ffdd44);
            color: #000000;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .app-container {
            max-width: 750px;
            width: 100%;
            background-color: #fff8eb;
            border: 2px solid #ffcc66;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #222;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }
        .display-box {
            width: 100%;
            height: 320px;
            border: 2px solid #ffd280;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 15px;
            background-color: #ffffff;
            overflow-y: auto;
        }
        .grid-ponies {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 8px;
            width: 100%;
            max-height: 100%;
            align-content: start;
        }
        .mini-pony {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff3db;
            border-radius: 6px;
            padding: 4px;
            font-size: 9px;
            text-align: center;
        }
        .mini-pony img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }
        .mini-pony span {
            margin-top: 2px;
            line-height: 1.1;
            word-break: break-word;
        }
        .display-box img.winner-img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 240px;
            overflow-y: auto;
        }
        .btn-option {
            background-color: #3b82f6;
            border: none;
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-option:hover {
            background-color: #2563eb;
        }
        .btn-option:active {
            transform: scale(0.98);
        }
        .btn-reset {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-reset:hover {
            background-color: #2563eb;
        }
    </style>
</head>

            { otazka: "4. Jakou barvu očí má tvá postava?", klic: "BarvaOci", moznosti: [{ text: "Zelená", hodnota: "Zelená" }, { text: "Modrá", hodnota: "Modrá" }, { text: "Modro-fialová", hodnota: "Modro-fialová" }, { text: "Fialová", hodnota: "Fialová" }, { text: "Tmavě fialová", hodnota: "Tmavě fialová" }, { text: "Purpurová", hodnota: "Purpurová" }, { text: "Tmavě modrá", hodnota: "Tmavě modrá" }, { text: "Červená", hodnota: "Červená" }, { text: "Žlutá", hodnota: "Žlutá" }, { text: "Tyrkysová", hodnota: "Tyrkysová" }, { text: "Hnědá", hodnota: "Hnědá" }, { text: "Tmavě zelená", hodnota: "Tmavě zelená" }, { text: "Oranžová", hodnota: "Oranžová" }, { text: "Světle modrá", hodnota: "Světle modrá" }] },
            { otazka: "5. Jakou barvu srsti (či kůže) má tvá postava?", klic: "BarvaSrsti", moznosti: [{ text: "Světle fialová", hodnota: "Světle fialová" }, { text: "Fialová", hodnota: "Fialová" }, { text: "Světle růžová", hodnota: "Světle růžová" }, { text: "Růžová", hodnota: "Růžová" }, { text: "Světle modrá", hodnota: "Světle modrá" }, { text: "Tmavě modrá", hodnota: "Tmavě modrá" }, { text: "Žlutá", hodnota: "Žlutá" }, { text: "Světle žlutá", hodnota: "Světle žlutá" }, { text: "Oranžová", hodnota: "Oranžová" }, { text: "Bílá", hodnota: "Bílá" }, { text: "Červená", hodnota: "Červená" }, { text: "Černá", hodnota: "Černá" }, { text: "Šedá", hodnota: "Šedá" }, { text: "Tmavě šedá", hodnota: "Tmavě šedá" }, { text: "Světle tyrkysová", hodnota: "Světle tyrkysová" }, { text: "Světle zelená", hodnota: "Světle zelená" }, { text: "Purpurová", hodnota: "Purpurová" }, { text: "Světle hnědá", hodnota: "Světle hnědá" }, { text: "Tmavě hnědá", hodnota: "Tmavě hnědá" }] },
            { otazka: "6. Má tělo / srst vaší postavy ještě nějakou sekundární barvu?", klic: "SekundarniSrsti", moznosti: [{ text: "Ano", hodnota: "Ano" }, { text: "Ne", hodnota: "Ne" }] },
            { otazka: "7. Jakou sekundární barvu má srst vaší postavy?", klic: "SekundarniBarvaSrsti", moznosti: [{ text: "Světle zelená", hodnota: "Světle zelená" }, { text: "Bílá", hodnota: "Bílá" }, { text: "Růžová", hodnota: "Růžová" }, { text: "Tmavě zelená", hodnota: "Tmavě zelená" }, { text: "Světle šedá / Bílá", hodnota: "Světle šedá / Bílá" }, { text: "Žádná / Nemá", hodnota: "" }] },
            { otazka: "8. Jakou hlavní barvu hřívy (či vlasů) má tvá postava?", klic: "BarvaHrivy", moznosti: [{ text: "Tmavě modrá", hodnota: "Tmavě modrá" }, { text: "Žlutá", hodnota: "Žlutá" }, { text: "Duhová", hodnota: "Duhová" }, { text: "Tmavě růžová", hodnota: "Tmavě růžová" }, { text: "Fialová", hodnota: "Fialová" }, { text: "Růžová", hodnota: "Růžová" }, { text: "Světle zelená", hodnota: "Světle zelená" }, { text: "Modrá", hodnota: "Modrá" }, { text: "Tyrkysová", hodnota: "Tyrkysová" }, { text: "Bílá", hodnota: "Bílá" }, { text: "Oranžová", hodnota: "Oranžová" }, { text: "Purpurová", hodnota: "Purpurová" }, { text: "Černá", hodnota: "Černá" }, { text: "Tmavá šedá", hodnota: "Tmavá šedá" }, { text: "Šedá", hodnota: "Šedá" }, { text: "Světle zlatá", hodnota: "Světle zlatá" }, { text: "Tmavě oranžová", hodnota: "Tmavě oranžová" }, { text: "Světle žlutá / Tmavě růžová / Tmavě fialová", hodnota: "Světle žlutá / Tmavě růžová / Tmavě fialová" }, { text: "Modrá / Zelená / Fialová / Růžová", hodnota: "Modrá / Zelená / Fialová / Růžová" }] },
            { otazka: "9. Má hříva vaší postavy nějakou sekundární barvu / další barvu?", klic: "SekundarniHrivy", moznosti: [{ text: "Ano", hodnota: "Ano" }, { text: "Ne", hodnota: "Ne" }] },
            { otazka: "10. Jakou sekundární barvu hřívy má tvá postava?", klic: "SekundarniBarvaHrivy", moznosti: [{ text: "Fialová", hodnota: "Fialová" }, { text: "Modrá", hodnota: "Modrá" }, { text: "Růžová / Oranžová", hodnota: "Růžová / Oranžová" }, { text: "Světle tyrkysová", hodnota: "Světle tyrkysová" }, { text: "Tmavě modrá / Průhledná", hodnota: "Tmavě modrá / Průhledná" }, { text: "Červená", hodnota: "Červená" }, { text: "Světle růžová", hodnota: "Světle růžová" }, { text: "Světle oranžová", hodnota: "Světle oranžová" }, { text: "Tmavě oranžová", hodnota: "Tmavě oranžová" }, { text: "Světle modrá", hodnota: "Světle modrá" }, { text: "Velmi světle modrá", hodnota: "Velmi světle modrá" }, { text: "Světle šedá", hodnota: "Světle šedá" }, { text: "Žádná / Nemá", hodnota: "" }] }
        ];

        let aktualniKrok = 0;
        let filtrPonici = [];

        function spustitHru() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            resetHry();
        }

        function resetHry() {
            aktualniKrok = 0;
            filtrPonici = [...ponici];
            document.getElementById("resetBtn").style.display = "none";
            nactiKrok();
        }

        function aktualizujMrizku() {
            const display = document.getElementById("displayBox");
            display.innerHTML = "";
            
            const grid = document.createElement("div");
            grid.className = "grid-ponies";

            filtrPonici.forEach(p => {
                const item = document.createElement("div");
                item.className = "mini-pony";
                item.innerHTML = `
                    <img src="${p.ObrazekCesta}" alt="${p.Jmeno}" title="${p.Jmeno}" onerror="this.src=''">
                    <span>${p.Jmeno}</span>
                `;
                grid.appendChild(item);
            });

            display.appendChild(grid);
        }

        function nactiKrok() {
            if (filtrPonici.length <= 1 || aktualniKrok >= kroky.length) {
                zobrazVysledek();
                return;
            }

            const krok = kroky[aktualniKrok];
            const unikatniHodnoty = [...new Set(filtrPonici.map(p => p[krok.klic]))];
            
            if (unikatniHodnoty.length <= 1) {
                aktualniKrok++;
                nactiKrok();
                return;
            }

            document.getElementById("questionText").innerText = krok.otazka;
            aktualizujMrizku();

            const btnBox = document.getElementById("buttonsContainer");
            btnBox.innerHTML = "";

            krok.moznosti.forEach(m => {
                const maKandidata = filtrPonici.some(p => p[krok.klic] === m.hodnota);
                if (maKandidata) {
                    const btn = document.createElement("button");
                    btn.className = "btn-option";
                    btn.innerText = m.text;
                    btn.onclick = () => vybratOdpoved(krok.klic, m.hodnota);
                    btnBox.appendChild(btn);
                }
            });
        }

        function vybratOdpoved(klic, hodnota) {
            filtrPonici = filtrPonici.filter(p => p[klic] === hodnota);
            aktualniKrok++;
            nactiKrok();
        }

        function zobrazVysledek() {
            document.getElementById("buttonsContainer").innerHTML = "";
            document.getElementById("resetBtn").style.display = "inline-block";

            const display = document.getElementById("displayBox");

            if (filtrPonici.length === 1) {
                const p = filtrPonici[0];
                document.getElementById("questionText").innerText = "Tvůj poník je:";
                display.innerHTML = `
                    <img class="winner-img" src="${p.ObrazekCesta}" alt="${p.Jmeno}" onerror="this.style.display='none'">
                    <p style="font-size:20px; font-weight:bold; margin-top:10px;">${p.Jmeno}</p>
                `;
            } else if (filtrPonici.length > 1) {
                document.getElementById("questionText").innerText = "Odpovídá více postavám!";
                let jmena = filtrPonici.map(p => p.Jmeno).join(", ");
                display.innerHTML = `<p style="font-size:16px;">Nalezeno ${filtrPonici.length} možností:<br><span style="font-size:14px; font-weight:normal;">${jmena}</span></p>`;
            } else {
                document.getElementById("questionText").innerText = "Nikoho jsem nenalezl :-(";
                display.innerHTML = `<p style="font-size:16px;">Žádná postava neodpovídá této kombinaci.</p>`;
            }
        }
    </script>
